<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Timer</title>
  <style>
    body {
      background-color: #37353E;
      color: #D3DAD9;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
      color: #D3DAD9;
    }

    .container {
      background-color: #44444E;
      border-radius: 8px;
      padding: 20px 30px;
      margin-top: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .display {
      font-size: 2em;
      text-align: center;
      margin: 20px 0;
      color: #D3DAD9;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
    }

    input[type="number"] {
      background-color: #715A5A;
      border: none;
      border-radius: 4px;
      padding: 5px;
      color: #D3DAD9;
      width: 60px;
      text-align: center;
      font-size: 1em;
      margin: 0 4px;
    }

    button {
      background-color: #715A5A;
      color: #D3DAD9;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      margin: 5px;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #D3DAD9;
      color: #37353E;
    }

    .job-list {
      margin-top: 20px;
      background-color: #44444E;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      padding: 15px;
      box-sizing: border-box;
    }

    .job-list h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
      color: #D3DAD9;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #715A5A;
    }

    li:last-child {
      border-bottom: none;
    }

    .highlight {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Job Timer</h1>
  <div class="container">
    <button id="toggleBtn">Start</button>

    <div class="display" id="currentTime">00:00:00</div>

    <div class="info">
      <span>Jobs Done: <span id="jobCount">0</span></span>
      <span>Avg Job Time: <span id="avgTime">00:00</span></span>
    </div>

    <div class="info">
      <span>Goal Avg:</span>
      <div>
        <input type="number" id="goalMin" placeholder="mm" min="0" /> :
        <input type="number" id="goalSec" placeholder="ss" min="0" max="59" />
      </div>
    </div>

    <div class="info">
      <span>Next Avg Target:</span>
      <span id="nextAvg">--:--</span>
    </div>

    <div class="info">
      <span>Remaining to Goal:</span>
      <span id="remaining">--:--</span>
    </div>

    <div class="info">
      <span>Total Elapsed:</span>
      <span id="totalElapsed">00:00:00</span>
    </div>

    <div style="text-align:center;">
      <button id="submitBtn">Submit Job</button>
    </div>
  </div>

  <div class="job-list">
    <h2>Job History</h2>
    <ul id="jobList"></ul>
  </div>

  <script>
    let timerInterval;
    let secondsElapsed = 0;
    let totalSecondsElapsed = 0;
    let jobTimes = [];
    let running = false;
    let totalTimerStarted = false;
    let totalStartTime = 0;

    const currentTime = document.getElementById('currentTime');
    const jobCount = document.getElementById('jobCount');
    const avgTime = document.getElementById('avgTime');
    const nextAvg = document.getElementById('nextAvg');
    const remaining = document.getElementById('remaining');
    const totalElapsed = document.getElementById('totalElapsed');
    const jobList = document.getElementById('jobList');
    const goalMin = document.getElementById('goalMin');
    const goalSec = document.getElementById('goalSec');
    const toggleBtn = document.getElementById('toggleBtn');

    function formatHMS(sec) {
      const sign = sec < 0 ? "-" : "";
      sec = Math.abs(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatMS(sec) {
      const sign = sec < 0 ? "-" : "";
      sec = Math.abs(sec);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${sign}${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function parseGoal() {
      const m = parseInt(goalMin.value) || 0;
      const s = parseInt(goalSec.value) || 0;
      return m * 60 + s;
    }

    function updateDisplay() {
      currentTime.textContent = formatHMS(secondsElapsed);
      updateTotalElapsed();
      updateGoalInfo();
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateDisplay();
      }, 1000);

      if (!totalTimerStarted) {
        totalStartTime = Date.now();
        totalTimerStarted = true;
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function toggleTimer() {
      if (!running) {
        startTimer();
        toggleBtn.textContent = "Stop";
        running = true;
      } else {
        stopTimer();
        secondsElapsed = 0;
        totalTimerStarted = false;
        totalSecondsElapsed = 0;
        totalElapsed.textContent = "00:00:00";
        toggleBtn.textContent = "Start";
        running = false;
      }
    }

    function calculateAverage() {
      if (jobTimes.length === 0) return 0;
      const total = jobTimes.reduce((a, b) => a + b, 0);
      return Math.round(total / jobTimes.length);
    }

    function updateGoalInfo() {
      const goalSec = parseGoal();
      if (goalSec <= 0) {
        nextAvg.textContent = '--:--';
        remaining.textContent = '--:--';
        return;
      }

      const avgSec = calculateAverage();
      const n = jobTimes.length;

      if (n === 0) {
        nextAvg.textContent = formatMS(goalSec);
      } else {
        const requiredNext = (goalSec * (n + 1)) - (avgSec * n);
        nextAvg.textContent = formatMS(Math.round(requiredNext));
      }

      const remainingSec = parseMS(nextAvg.textContent) - secondsElapsed;
      remaining.textContent = formatMS(remainingSec);
    }

    function updateTotalElapsed() {
      if (totalTimerStarted) {
        const diffSec = Math.floor((Date.now() - totalStartTime) / 1000);
        totalElapsed.textContent = formatHMS(diffSec);
      }
    }

    function parseMS(str) {
      const [m, s] = str.split(':').map(Number);
      return (m * 60) + s;
    }

    document.getElementById('submitBtn').addEventListener('click', () => {
      if (!running) return; // Only works while running
      jobTimes.push(secondsElapsed);
      const li = document.createElement('li');
      li.innerHTML = `<span>Job ${jobTimes.length}</span><span>${formatHMS(secondsElapsed)}</span>`;
      jobList.insertBefore(li, jobList.firstChild);

      jobCount.textContent = jobTimes.length;
      avgTime.textContent = formatMS(calculateAverage());
      totalSecondsElapsed += secondsElapsed;

      // Reset current job timer but keep running
      secondsElapsed = 0;
      updateDisplay();
    });

    toggleBtn.addEventListener('click', toggleTimer);
    goalMin.addEventListener('input', updateGoalInfo);
    goalSec.addEventListener('input', updateGoalInfo);

    updateDisplay();
  </script>
</body>
</html>
